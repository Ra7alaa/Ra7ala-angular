<div class="login-page row m-0">
  <!-- Left: Bus Image -->
  <div class="col-md-6 p-0">
    <div class="bus-container">
      <img
        src="assets/images/r7ala-bus.svg"
        alt="Bus"
        class="bus-image img-fluid"
      />
    </div>
  </div>

  <!-- Right: Login Form -->
  <div class="col-md-6 p-0">
    <div class="form-container">
      <div class="form-content">
        <h1 class="logo-title">Ra7ala</h1>

        <form
          [formGroup]="loginForm"
          (ngSubmit)="onSubmit()"
          class="login-form"
        >
          <!-- Error message -->
          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <!-- Email Address -->
          <div class="form-group mb-4">
            <label for="emailOrUsername" class="form-label"
              >{{ 'auth.email_or_username' | translate }}</label
            >
            <div class="input-wrapper">
              <input
                type="email"
                id="emailOrUsername"
                formControlName="emailOrUsername"
                class="form-control"
                [placeholder]="'auth.enter_email_or_username' | translate"
              />
              <span class="input-icon">
                <i class="fa fa-envelope"></i>
              </span>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group mb-4">
            <label for="password" class="form-label">{{ 'auth.password' | translate }}</label>
            <div class="input-wrapper">
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                formControlName="password"
                class="form-control"
                [placeholder]="'auth.password' | translate"
              />
              <span class="input-icon">
                <i class="fa fa-lock"></i>
              </span>
            </div>
          </div>

          <!-- Remember me and forgot password -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="rememberMe"
                formControlName="rememberMe"
              />
              <label class="form-check-label" for="rememberMe"
                >{{ 'auth.remember_me' | translate }}</label
              >
            </div>
            <a routerLink="/auth/forgot-password" class="forgot-link"
              >{{ 'auth.forgot_password' | translate }}</a
            >
          </div>

          <!-- Login button -->
          <button
            type="submit"
            [disabled]="loginForm.invalid || isSubmitting"
            class="btn btn-login w-100"
          >
            {{ (isSubmitting ? 'auth.logging_in' : 'auth.login') | translate }}
          </button>

          <!-- Register link -->
          <div class="text-center mt-3 signup-text">
            <span>{{ 'auth.not_member_yet' | translate }} </span>
            <a routerLink="/auth/register" class="create-account"
              >{{ 'auth.create_account' | translate }}</a
            >
          </div>

          <!-- Quick Demo Login Section -->
          <div class="quick-login-section mt-5">
            <div class="divider-container">
              <span class="divider-text">{{ 'auth.quick_demo_login' | translate }}</span>
            </div>
            
            <div class="demo-buttons-grid">
              <button type="button" class="demo-btn admin-btn" (click)="quickLogin('superadmin')">
                <i class="fa fa-user-shield"></i>
                <span>{{ 'auth.super_admin' | translate }}</span>
              </button>
              
              <button type="button" class="demo-btn owner-btn" (click)="quickLogin('owner')">
                <i class="fa fa-building"></i>
                <span>{{ 'auth.owner' | translate }}</span>
              </button>
              
              <button type="button" class="demo-btn passenger-btn" (click)="quickLogin('passenger')">
                <i class="fa fa-user"></i>
                <span>{{ 'auth.passenger' | translate }}</span>
              </button>
            </div>
            <p class="demo-hint">{{ 'auth.click_to_login' | translate }}</p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
