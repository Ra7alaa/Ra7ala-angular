<div
  class="container py-4"
  [dir]="currentLanguage.rtl ? 'rtl' : 'ltr'"
  [ngClass]="{ 'dark-theme': isDarkTheme() }"
>
  <h1 class="mb-4 fw-bold text-primary">{{ "settings.title" | translate }}</h1>

  <div class="row g-4">
    <!-- Language & Theme Settings Hidden as per user request -->

    <!-- Logout Section -->
    <div class="col-md-12 mt-3">
      <div
        class="card shadow-sm"
        role="region"
        [attr.aria-label]="'auth.logout' | translate"
      >
        <div class="card-body">
          <h2 class="card-title h5 mb-3 text-primary">
            <i class="fas fa-sign-out-alt me-2" aria-hidden="true"></i>
            {{ "auth.logout" | translate }}
          </h2>
          <p class="text-muted mb-4">
            {{ "settings.logout_description" | translate }}
          </p>
          <button
            class="btn logout-btn"
            (click)="logout()"
            [attr.aria-label]="'auth.logout' | translate"
            type="button"
          >
            <i class="fas fa-sign-out-alt me-2" aria-hidden="true"></i>
            {{ "auth.logout" | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
