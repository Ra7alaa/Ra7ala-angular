<div class="language-settings">
  <div
    class="list-group"
    role="radiogroup"
    [attr.aria-label]="'settings.language_title' | translate"
  >
    <label
      *ngFor="let language of languages"
      class="list-group-item list-group-item-action d-flex align-items-center"
      [class.active]="currentLanguage.code === language.code"
      [attr.aria-label]="
        'theme_language.' + (language.code === 'en' ? 'english' : 'arabic')
          | translate
      "
    >
      <input
        type="radio"
        name="language"
        [value]="language.code"
        [checked]="currentLanguage.code === language.code"
        (change)="onLanguageChange(language.code)"
        class="form-check-input me-2"
        [attr.aria-label]="
          'theme_language.' + (language.code === 'en' ? 'english' : 'arabic')
            | translate
        "
      />
      <span class="ms-2">
        <i
          class="me-2"
          [ngClass]="{
            'fa fa-globe-americas': language.code === 'en',
            'fa fa-globe-asia': language.code === 'ar'
          }"
          aria-hidden="true"
        ></i>
        <span>{{
          "theme_language." + (language.code === "en" ? "english" : "arabic")
            | translate
        }}</span>
        <span
          *ngIf="language.rtl"
          class="badge ms-2"
          style="background-color: var(--primary-color)"
          [attr.aria-label]="'theme_language.rtl_support' | translate"
          >RTL</span
        >
      </span>
    </label>
  </div>
</div>
