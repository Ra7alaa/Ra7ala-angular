<div class="theme-settings">
  <div
    class="list-group"
    role="radiogroup"
    [attr.aria-label]="'settings.theme_title' | translate"
  >
    <label
      *ngFor="let theme of themes"
      class="list-group-item list-group-item-action d-flex align-items-center"
      [class.active]="currentTheme === theme.value"
      [attr.aria-label]="theme.label | translate"
    >
      <input
        type="radio"
        name="theme"
        [value]="theme.value"
        [checked]="currentTheme === theme.value"
        (change)="onThemeChange(theme.value)"
        class="form-check-input me-2"
        [attr.aria-label]="theme.label | translate"
      />
      <span class="ms-2">
        <i
          class="me-2"
          [ngClass]="{
            'fa fa-sun': theme.value === 'light',
            'fa fa-moon': theme.value === 'dark'
          }"
          aria-hidden="true"
        ></i>
        {{ theme.label | translate }}
      </span>
    </label>
  </div>
</div>
